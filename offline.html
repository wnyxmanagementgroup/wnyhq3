<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WNY App ออฟไลน์</title>
  <meta name="theme-color" content="#e0f2fe">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      font-family: "Sarabun", system-ui, sans-serif;
      background: linear-gradient(135deg, #fff1f7 0%, #f8fbff 45%, #e0f2fe 100%);
      color: #1e293b;
    }
    .card {
      width: min(100%, 420px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(186, 230, 253, 0.9);
      border-radius: 24px;
      box-shadow: 0 20px 44px rgba(14, 165, 233, 0.12);
      padding: 28px 24px;
      text-align: center;
    }
    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
      line-height: 1.35;
    }
    p {
      margin: 12px 0 0;
      color: #64748b;
      line-height: 1.7;
      font-size: 0.95rem;
    }
    a {
      display: inline-flex;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      color: #075985;
      background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 50%, #f9a8d4 100%);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>ขณะนี้อุปกรณ์ออฟไลน์อยู่</h1>
    <p>WNY App เปิดเปลือกแอปบนมือถือได้แล้ว แต่บางข้อมูลยังต้องใช้อินเทอร์เน็ตเพื่อดึงข้อมูลล่าสุดจากระบบ</p>
    <a href="./app/">ลองเปิดหน้าแอปอีกครั้ง</a>
  </div>
</body>
</html>
